name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Run Linter
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,migrations,venv,env,node_modules || true
        flake8 . --count --max-line-length=120 --statistics --exclude=.git,__pycache__,migrations,venv,env,node_modules
        echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install JSHint
      run: npm install jshint --global
    - name: Run Linter
      run: |
        find ./server/database -path ./server/database/node_modules -prune -o -type f -name "*.js" -exec jshint {} +
        echo "Linted all the js files successfully"
